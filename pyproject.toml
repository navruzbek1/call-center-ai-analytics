[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callanalytics"
version = "0.1.0"
description = "Call-center qo'ng'iroqlarini AI bilan tahlil qilish tizimining yadro qismlari."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["google-genai"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib"]

[tool.setuptools]
packages = ["callanalytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
